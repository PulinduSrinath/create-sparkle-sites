<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!-- Non-blocking font load: removes fonts from critical path -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <!-- LCP image preload with high priority -->
    <link rel="preload" as="image" href="/premium-logo-icon.webp" fetchpriority="high" />
    <link rel="icon" type="image/webp" href="/premium-logo-icon.webp" />
    <title>ZetasBuild - Web & Product Development Agency</title>
    <meta name="description" content="ZetasBuild builds high-performance websites and apps using Vite, React, and modern technologies." />
    <meta name="author" content="ZetasBuild" />

    <meta property="og:title" content="ZetasBuild - Web & Product Development Agency" />
    <meta property="og:description" content="Transform your ideas into stunning digital experiences." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/premium-logo-icon.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ZetasBuild" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: ws: wss:;" />
    <meta name="twitter:image" content="/premium-logo-icon.webp" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
